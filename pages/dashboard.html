<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Employee Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/app.css">

</head>

<body data-page="dashboard" data-page-title="Dashboard">

    <div class="app-layout">

        <aside class="app-sidebar d-none d-lg-block">

            <div id="sidebar-container" class="h-100">
            </div>

        </aside>

        <main class="app-main">

            <div id="navbar-container"></div>

            <section class="app-content">

                <div class="mb-4">

                    <h3>
                        Dashboard
                    </h3>

                    <p class="text-secondary mb-0">
                        Overview of task activity.
                    </p>

                </div>

                <div class="row g-3">

                    <div class="col-xl-3 col-md-6">

                        <div class="card shadow-sm border-0 h-100 cursor-pointer" role="button" onclick="goToTasks()">

                            <div class="card-body">

                                <i class="fa fa-list-check fa-lg text-primary"></i>

                                <div class="text-secondary mt-2">
                                    Total Tasks
                                </div>

                                <h2 id="totalTasks">
                                    0
                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="card shadow-sm border-0 h-100 cursor-pointer" role="button"
                            onclick="goToTasks({ status: 'Pending' })">

                            <div class="card-body">

                                <i class="fa fa-clock fa-lg text-warning"></i>

                                <div class="text-secondary mt-2">
                                    Pending Tasks
                                </div>

                                <h2 id="pendingTasks">
                                    0
                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="card shadow-sm border-0 h-100 cursor-pointer" role="button"
                            onclick="goToTasks({ status: 'Completed' })">

                            <div class="card-body">

                                <i class="fa fa-circle-check fa-lg text-success"></i>

                                <div class="text-secondary mt-2">
                                    Completed Tasks
                                </div>

                                <h2 id="completedTasks">
                                    0
                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-xl-3 col-md-6">

                        <div class="card shadow-sm border-0 h-100 cursor-pointer" role="button"
                            onclick="goToTasks({ priority: 'High' })">

                            <div class="card-body">

                                <i class="fa fa-flag fa-lg text-danger"></i>

                                <div class="text-secondary mt-2">
                                    High Priority
                                </div>

                                <h2 id="highPriorityTasks">
                                    0
                                </h2>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="card shadow-sm border-0 mt-4">

                    <div class="card-header bg-white">

                        <h5 class="mb-0">

                            <i class="fa fa-clock me-2 text-primary"></i>

                            Recent 5 Tasks

                        </h5>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover mb-0">

                            <thead class="table-light">

                                <tr>

                                    <th>Task</th>
                                    <th>Assigned To</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Due Date</th>
                                    <th>Completed On</th>

                                </tr>

                            </thead>

                            <tbody id="recentTasksBody">

                                <tr>

                                    <td colspan="5" class="text-center text-secondary py-4">

                                        No recent tasks.

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <div id="mobile-sidebar-container"></div>

    <div class="modal fade" id="logoutModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">

                        <i class="fa fa-right-from-bracket text-danger me-2"></i>

                        Confirm Logout

                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">
                    Are you sure you want to logout?
                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button type="button" id="confirmLogoutButton" class="btn btn-danger">

                        <i class="fa fa-right-from-bracket me-1"></i>

                        Logout

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>

</body>

</html>
