<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employees - Employee Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/app.css">

</head>

<body data-page="employees"
      data-page-title="Employees">

<div class="app-layout">

    <aside class="app-sidebar d-none d-lg-block">

        <div id="sidebar-container"
             class="h-100">
        </div>

    </aside>

    <main class="app-main">

        <div id="navbar-container"></div>

        <section class="app-content">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <div>

                    <h3>
                        Employees
                    </h3>

                    <p class="text-secondary mb-0">
                        Manage employee accounts.
                    </p>

                </div>

                <button class="btn btn-primary admin-only"
                        onclick="openCreateEmployee()">

                    <i class="fa fa-plus me-1"></i>

                    Add Employee

                </button>

            </div>

            <div class="card shadow-sm border-0">

                <div class="table-responsive">

                    <table class="table table-hover mb-0">

                        <thead class="table-light">

                            <tr>

                                <th>S.No</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="employeeTableBody">

                            <tr>

                                <td colspan="6"
                                    class="text-center text-secondary py-4">

                                    Loading...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="card-footer bg-white border-0 py-2">

                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                        <div class="d-flex align-items-center gap-2">

                            <label for="employeePageSize" class="text-secondary small mb-0">
                                Show
                            </label>

                            <select id="employeePageSize" class="form-select form-select-sm w-auto">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>

                            <span class="text-secondary small">
                                per page
                            </span>

                        </div>

                        <div id="employeePagination"></div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<div id="mobile-sidebar-container"></div>

<!-- Employee Modal -->
<div class="modal fade"
     id="employeeModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 id="employeeModalTitle"
                    class="modal-title">

                    Add Employee

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <form id="employeeForm">

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input id="employeeName"
                               class="form-control"
                               maxlength="100"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input id="employeeEmail"
                               type="email"
                               class="form-control"
                               maxlength="150"
                               required>

                    </div>

                    <div id="employeePasswordGroup"
                         class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <input id="employeePassword"
                                   type="password"
                                   class="form-control"
                                   minlength="6">

                            <button id="toggleEmployeePassword"
                                    type="button"
                                    class="btn btn-outline-secondary">

                                <i class="fa fa-eye"></i>

                            </button>

                        </div>

                    </div>

                    <div class="form-check mb-3">

                        <input id="employeeIsActive"
                               class="form-check-input"
                               type="checkbox"
                               checked>

                        <label class="form-check-label">
                            Active
                        </label>

                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button id="saveEmployeeButton"
                            type="submit"
                            class="btn btn-primary">

                        Save

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Logout Modal -->
<div class="modal fade"
     id="logoutModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="fa fa-right-from-bracket text-danger me-2"></i>

                    Confirm Logout

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">
                Are you sure you want to logout?
            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button type="button"
                        id="confirmLogoutButton"
                        class="btn btn-danger">

                    <i class="fa fa-right-from-bracket me-1"></i>

                    Logout

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="../js/employee.js"></script>

</body>
</html>
